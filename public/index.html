<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Deepdive</title><meta name="description" content="Seven prompts. The rarer your answer, the deeper you sink."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 56'%3E%3Cpath d='M5 26C5 6 35 6 35 26Z' fill='%236ff7e1'/%3E%3Cpath d='M12 29v18M20 29v22M28 29v18' stroke='%23a98bff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
/* Deepdive: bioluminescence. Near-black deep water; the only light comes from living things (aqua, violet).
   The glowing jellyfish is the brand. One clean typeface: Manrope. */
:root{color-scheme:dark;--ink:#020814;--panel:#08142acc;--panel2:#0e1f3a;--line:#1a3150;--edge:#6ff7e11f;--foam:#e8f6fa;--mut:#8ba3b8;
 --aqua:#6ff7e1;--violet:#a98bff;--krill:#ff8ad8;--buoy:#6ff7e1;--buoy-ink:#03231f;--coral:#ff7a8a;
 --display:Manrope,ui-sans-serif,system-ui,-apple-system,sans-serif;--body:Manrope,ui-sans-serif,system-ui,-apple-system,sans-serif;
 --ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.4,0,1,1);--r:16px}
*{box-sizing:border-box}
html{background:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--foam);font:16px/1.45 var(--body);background:var(--ink);overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#020814b3;color:var(--foam);font:inherit;font-size:17px;text-align:center;outline:none;transition:border-color .2s,box-shadow .2s}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}

/* ---------- water ---------- */
#sea,#deep,#rays,#bub,#world{position:fixed;inset:0;pointer-events:none}
#sea{background:radial-gradient(ellipse 100% 60% at 50% 0,#0b2a46,#04101f 55%,#020814)}
#deep{background:#020a14;opacity:0;transition:opacity 1.8s var(--ease-out)}
#rays{background:radial-gradient(ellipse 60% 35% at 50% 18%,#6ff7e112,transparent 70%);transition:opacity 1.5s}
#bub{overflow:hidden}
#bub i{position:absolute;bottom:-30px;border-radius:50%;border:1px solid #9ffcec40;box-shadow:0 0 6px #6ff7e133;animation:rise linear infinite}
#bub i.f{bottom:-20px;animation-timing-function:cubic-bezier(.3,.1,.6,1);animation-iteration-count:1}
@keyframes rise{to{transform:translateY(-110vh) translateX(var(--dx))}}
#rail,#pm,#flash,.sp{display:none}
#world{overflow:hidden;--span:520vh}
#swim{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.sw{position:absolute;left:0;opacity:var(--o);will-change:transform;animation:swimR var(--dur) linear forwards}
.sw.l{animation-name:swimL}
.sw svg{display:block;width:100%;height:auto;fill:#9fe3f2}
.sw .bob{animation:swbob var(--bob,5s) ease-in-out infinite alternate}
@keyframes swimR{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
@keyframes swimL{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
@keyframes swbob{from{translate:0 -6px}to{translate:0 6px}}
.sw.j{top:0;animation-name:drift}
.sw.j .jf{filter:drop-shadow(0 0 6px #6ff7e180)}
@keyframes drift{from{transform:translateY(105vh)}to{transform:translateY(-30vh)}}
#scene,#snowF,#snowN{height:calc(100vh + var(--span) * 1.35);opacity:.5;filter:drop-shadow(0 0 3px #6ff7e1);background-image:radial-gradient(2px 2px at 40px 60px,#9ffcec 50%,transparent 51%),radial-gradient(2.2px 2.2px at 230px 260px,#c4b4ff 50%,transparent 51%);background-size:300px 340px;animation:glimmer 5s ease-in-out infinite alternate}
@keyframes glimmer{to{opacity:.2}}
#scene{height:calc(100vh + var(--span))}
#snowF{height:calc(100vh + var(--span) * .55);opacity:.55;background-image:radial-gradient(1.4px 1.4px at 20px 30px,#9ffcec 50%,transparent 51%),radial-gradient(1px 1px at 120px 90px,#c4b4ff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70px 160px,#9ffcec 50%,transparent 51%);background-size:200px 230px}
#snowN{height:calc(100vh + var(--span) * 1.35);opacity:.22;background-image:radial-gradient(2px 2px at 40px 60px,#e6eef3 50%,transparent 51%),radial-gradient(2.4px 2.4px at 230px 260px,#e6eef3 50%,transparent 51%);background-size:300px 340px}
.surf{position:absolute;left:0;right:0;top:0;height:12vh;background:linear-gradient(#a8d8f02a,transparent)}
.surf svg{position:absolute;left:-10%;width:120%;bottom:-6px;height:12px;animation:wave 9s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(6%)}}
.cr{position:absolute;color:#030d1c;opacity:.85}
.cr svg{display:block;width:100%;height:auto;fill:currentColor;overflow:visible}
.cr.swim{animation:swim 16s ease-in-out infinite alternate}.cr.swim.r{animation-direction:alternate-reverse}
@keyframes swim{to{transform:translateX(-40px)}}
.cr.glow{color:var(--aqua);opacity:.4}
.cr .jf{filter:none}
.cr .lure{fill:var(--aqua);filter:drop-shadow(0 0 4px var(--aqua));animation:blink 2.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.cr.dark{color:#010711;opacity:1}
.tick{position:absolute;right:0;width:8px;border-top:1px solid #ffffff1f}.tick.m{width:16px;border-color:#ffffff33}
.tick b{position:absolute;right:22px;top:-8px;font:600 11px var(--display);color:#9ffcec59;white-space:nowrap}

/* ---------- the jellyfish ---------- */
.jf{display:block;width:100%;height:100%;overflow:visible;color:var(--aqua);filter:drop-shadow(0 0 4px #6ff7e1b3) drop-shadow(0 0 16px #6ff7e159)}
.jf .bob{animation:jbob 5s ease-in-out infinite}
@keyframes jbob{50%{transform:translateY(-5px)}}
.jf .bell{transform-box:fill-box;transform-origin:50% 100%;animation:jpulse 2.6s cubic-bezier(.45,0,.3,1) infinite}
@keyframes jpulse{0%,100%{transform:none}35%{transform:scale(1.07,.86)}}
.jf .bo{fill:#6ff7e124;stroke:currentColor;stroke-width:1.6}
.jf .bi{fill:#6ff7e112;stroke:currentColor;stroke-opacity:.35;stroke-width:1}
.jf .go{fill:none;stroke:var(--violet);stroke-width:1.7;stroke-linecap:round}
.jf .s{fill:#eafffb;animation:twinkle 2.2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2}}
.jf .t{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.jf .tl{fill:none;stroke:currentColor;stroke-opacity:.5;stroke-width:1.2;stroke-linecap:round}
.jf .l{fill:none;stroke:#eafffb;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:6 94;animation:travel 2.8s linear infinite}
@keyframes travel{from{stroke-dashoffset:6}to{stroke-dashoffset:-94}}
.jf .arm path{fill:none;stroke:var(--violet);stroke-opacity:.8;stroke-width:2.2;stroke-linecap:round}
.hero{position:relative;isolation:isolate;width:118px;height:177px;margin:6px auto 4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hero:before{content:'';position:absolute;z-index:-1;inset:-25% -70% 10%;border-radius:50%;background:radial-gradient(closest-side,#6ff7e130,#a98bff12 60%,transparent);animation:breathe 2.6s cubic-bezier(.45,0,.3,1) infinite}
@keyframes breathe{35%{opacity:.6;transform:scale(.93)}}
.hero.zap .jf{animation:zap .7s var(--ease-out)}
@keyframes zap{30%{filter:drop-shadow(0 0 6px #6ff7e1) drop-shadow(0 0 24px #6ff7e1aa) brightness(1.25)}}

/* ---------- layout ---------- */
main{position:relative;max-width:440px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
header h1{margin:0;font:800 19px/1 var(--display);letter-spacing:-.02em}
header .krill{order:-1;width:16px;height:24px}
header .sub{display:none}
body[data-s=home] header{display:none}

/* signature: the dive computer readout */
.hud{display:flex;flex-direction:column;margin:8px 0 16px}
body:not([data-s=game]):not([data-s=end]) .hud{display:none}
.meta{order:-1;position:relative;display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
#depth{order:-1;font:800 46px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-shadow:0 0 22px #6ff7e140}
#zone{font-size:14px;font-weight:600;color:var(--aqua)}
.gain{position:absolute;left:0;top:-20px;font-weight:700;font-size:15px;color:var(--aqua);text-shadow:0 0 10px #6ff7e199;font-variant-numeric:tabular-nums;animation:gain 1.4s var(--ease-out) forwards;pointer-events:none}
@keyframes gain{0%{opacity:0;transform:translateY(6px)}18%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-12px)}}
.bar{position:relative;height:6px;border-radius:3px;background:#ffffff17}
#bar,#barf,#barg,#tb,#tbg{background:linear-gradient(90deg,var(--aqua),#9ffcec);transition:background-color .4s}
#bar,#barf,#tb{overflow:hidden}
#barf,#barg{transition:transform 1.5s var(--ease-out)}
#barf{transform:translateX(-100%)}#barg{transform:translateX(100%);background:linear-gradient(90deg,var(--aqua),var(--violet))}#barg{transform:translateX(100%);background:var(--buoy)}
.bar b{position:absolute;top:-4px;bottom:-4px;width:1px;background:#ffffff2e;transition:background .5s}
.bar b.on{background:#ffffff99}
.cap{position:absolute;inset:0;transform:translateX(-100%);opacity:0;transition:transform 1.5s var(--ease-out),opacity .4s;pointer-events:none}
.cap:after{content:'';position:absolute;right:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#eafffb;box-shadow:0 0 8px var(--aqua),0 0 18px var(--aqua)}

/* ---------- cards ---------- */
.q,.panel{background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--edge);border-radius:var(--r);padding:22px 18px;text-align:center;margin-bottom:14px;box-shadow:inset 0 1px 0 #ffffff0a,0 24px 60px -28px #000}
.q small{font-size:14px;color:var(--mut)}
.q h2{margin:6px 0 18px;font:700 22px/1.3 var(--body);letter-spacing:-.015em;text-wrap:balance}
h3{margin:18px 0 4px;font-size:14px;font-weight:700;color:var(--mut)}
.note{color:var(--mut);font-size:14px;margin-top:10px;line-height:1.4}
.left{text-align:left}
input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--foam);font:inherit;font-size:17px;text-align:center;outline:none;transition:border-color .2s}
input::placeholder{color:#8ea6b9b3}
input:focus{border-color:#6ff7e1b3;box-shadow:0 0 0 3px #6ff7e11f,0 0 18px #6ff7e126}
input:disabled{opacity:.7}
button{position:relative;display:block;width:100%;min-height:50px;margin-top:10px;padding:13px 14px;border:1px solid transparent;border-radius:12px;background:linear-gradient(180deg,#93fbea,#5ee8d1);color:var(--buoy-ink);font:700 16px/1.2 var(--body);letter-spacing:-.005em;cursor:pointer;box-shadow:0 0 0 1px #6ff7e166,0 8px 26px -10px #6ff7e1b3;transition:transform .25s var(--ease-out),box-shadow .2s,background-color .15s,border-color .15s}
button.alt{background:#ffffff08;color:var(--foam);border-color:var(--edge);box-shadow:none}
@media(hover:hover){button:hover:not(:disabled){box-shadow:0 0 0 1px #6ff7e199,0 10px 34px -8px #6ff7e1cc}button.alt:hover:not(:disabled){background:#6ff7e10f;border-color:#6ff7e14d;box-shadow:none}}
button:active:not(:disabled){transform:scale(.97);transition-duration:.08s}
button:disabled{opacity:.5;cursor:default}
button.loading{opacity:1;color:transparent!important}button.loading>*{visibility:hidden}
button.loading:after{content:'';position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;border:2px solid #03231f40;border-top-color:var(--buoy-ink);animation:spin .7s linear infinite}
button.alt.loading:after{border-color:#ffffff30;border-top-color:var(--foam)}
@keyframes spin{to{transform:rotate(1turn)}}
button.sm{display:inline-block;width:auto;min-height:40px;margin-top:0;padding:8px 16px;font-size:14px}
.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1;min-width:0;letter-spacing:.3em}.row button{margin:0;width:auto;padding:0 22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- home ---------- */
.home{text-align:center;padding-top:8px}
.logo{margin:0 0 10px;font:800 50px/1 var(--display);letter-spacing:-.035em;color:#effffc;text-shadow:0 0 28px #6ff7e14d}

.tag{color:var(--mut);font-size:16px;line-height:1.5;margin:0 auto 24px;max-width:290px}
button.daily{display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 14px}
.dl{font-size:17px}.ds{font-size:13px;font-weight:400;opacity:.78}
details.how{margin-top:14px;color:var(--mut);font-size:15px}
details.how summary{display:inline-block;cursor:pointer;padding:10px 4px;list-style:none;text-decoration:underline;text-underline-offset:3px}
details.how summary::-webkit-details-marker{display:none}
details.how p{text-align:left;line-height:1.5;margin:4px 0 0}

/* ---------- game ---------- */
.pips{display:none}
.tw{display:flex;align-items:center;gap:10px;margin:12px 0 2px;transition:opacity .3s}
.tt{position:relative;flex:1;height:4px;border-radius:2px;background:#ffffff17;overflow:hidden}
#tbg{background:var(--foam);transition:background-color .4s}
.tp{min-width:30px;text-align:right;font-size:14px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;transition:color .3s}
.tp svg{display:none}
.tw.low #tbg{background:var(--coral)}.tw.low .tp{color:var(--coral)}
.tw.hold{opacity:.5}.tw.out{opacity:.25}
.fb{margin-top:16px;min-height:54px;font-size:17px}
.fb b{color:var(--aqua);font-variant-numeric:tabular-nums}
.fb small{display:block;margin-top:2px;font-size:14px;color:var(--mut)}
.fb .kr,.fb .kr b{color:var(--krill);font-weight:700;text-shadow:0 0 16px #ff8ad880}
.err{display:inline-block;color:var(--coral)}
.pop{animation:pop .4s var(--ease-out) both}@keyframes pop{from{opacity:0;transform:translateY(4px)}}
.shake,.box-in .shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
body.dip main{animation:dip .6s var(--ease-out)}@keyframes dip{40%{transform:translateY(4px)}}

/* ---------- lists & results ---------- */
ul{list-style:none;padding:0;margin:12px 0 0;text-align:left}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:15px}
li:last-child{border-bottom:0}
li.me{background:#6ff7e112;border-radius:8px;border-bottom-color:transparent}
li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li span:last-child{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.pl li{justify-content:flex-start}.pl .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg{flex:none;padding:2px 8px;border-radius:6px;background:#ffffff12;color:var(--mut)!important;font-size:12px}
.av{display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;color:var(--ink);font-weight:700;font-size:13px}
.res li span:first-child{white-space:normal;font-weight:700}
.res small{display:block;font-weight:400;font-size:13px;color:var(--mut)}
.kb{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--krill);color:#2a0820;font-size:11px;font-weight:800;font-style:normal;vertical-align:1px;box-shadow:0 0 12px #ff8ad866}
em{color:var(--mut);font-style:normal;font-weight:400}
.big{margin:2px 0 0;font:800 64px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-shadow:0 0 30px #6ff7e14d}
.end-zone{margin:4px 0 0;font-size:17px;font-weight:700;color:var(--aqua)}
.sq{margin-top:14px;font-size:18px;letter-spacing:3px}
li.sk span{display:block;height:12px;width:55%;margin:4px 0;border-radius:6px;background:linear-gradient(90deg,#ffffff0d 30%,#ffffff1c 50%,#ffffff0d 70%);background-size:300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}

/* ---------- multiplayer ---------- */
.or{margin:18px 0 0;color:var(--mut);font-size:14px}
.codebox{display:inline-block;margin:6px 0 10px;padding:8px 18px;border:1px dashed var(--line);border-radius:10px}
.code{font:800 40px/1 var(--display);letter-spacing:.18em;padding-left:.18em;color:#effffc;text-shadow:0 0 22px #6ff7e159}
.race{display:grid;gap:6px;max-height:34vh;overflow-y:auto;margin-bottom:12px;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.rr{display:flex;align-items:center;gap:8px}.rr .av{width:20px;height:20px;font-size:10px}
.rb{flex:1;height:4px;border-radius:2px;background:#ffffff17;overflow:hidden}
.rb i{display:block;height:100%;background:var(--mut);transition:width .8s var(--ease-out)}.rr.me .rb i{background:linear-gradient(90deg,var(--aqua),var(--violet))}
.rr b{min-width:34px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:18px 0 6px}
.pc{flex:1;max-width:112px;min-width:0;display:flex;flex-direction:column;align-items:center}
.pa{position:relative;margin-bottom:6px}.pa .av{width:44px;height:44px;font-size:17px;box-shadow:0 0 0 3px var(--panel)}
.p0 .pa .av{width:54px;height:54px;font-size:20px}
.crown{position:absolute;right:-5px;bottom:-3px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--panel)}
.crown svg{width:13px;height:13px}
.pn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700}
.ps{margin-bottom:8px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.pb{width:100%;display:flex;justify-content:center;padding-top:8px;border-radius:10px 10px 0 0;transform-origin:bottom}
.pb span{font:800 26px/1 var(--display);color:#00000052}
.p0 .pb{height:96px;background:#f2c14e}.p1 .pb{height:72px;background:#c3cdd9}.p2 .pb{height:56px;background:#cf9466}
.grow .pb{animation:grow .6s var(--ease-out) both;animation-delay:calc(80ms + var(--d,0)*100ms)}
ul.ranks{margin-top:0;border-top:1px solid var(--line);padding-top:6px}
.ranks li.lr{gap:10px;padding:9px 10px;margin-top:4px;border:1px solid transparent;border-radius:10px}
.ranks li.lr:last-child{border-bottom:1px solid transparent}
.ranks li.lr+li.lr{border-top-color:transparent}
.lr .rn{flex:none;width:16px;text-align:center;font-weight:700;color:var(--mut)!important;font-variant-numeric:tabular-nums}
.tro{flex:none;width:18px;height:18px}
.lr .who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.lr .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .who em{font-weight:400}
.lr .who small{font-size:13px;color:var(--mut)}
.lr .val{font-weight:700;color:var(--foam)!important;font-variant-numeric:tabular-nums}
.lr.me{background:var(--panel2);border-color:#6ff7e159}
li.empty{justify-content:center;color:var(--mut);padding:18px 4px}
.q.lb{text-align:left}.lbh{margin-bottom:12px}.lbh h2{margin:0}
.sub2{margin:2px 0 0;font-size:14px;color:var(--mut)}
.q.lb .tabs{display:grid;width:100%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stats div{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:62px;padding:8px 6px;border-radius:12px;background:#ffffff06;border:1px solid var(--edge)}
.stats b{font-size:15px;line-height:1.2}.stats span{font-size:12px;color:var(--mut)}
.lh{text-align:left;margin:18px 0 0}
ul.res{margin-top:8px}
.res li{margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.res li:last-child{border-bottom:1px solid var(--line)}
.res li.k{border-color:#ff8ad866;background:#ff8ad80d}
.res .pts{flex:none;padding:3px 8px;border-radius:6px;background:#ffffff0f;color:var(--foam)!important;font-size:13px;font-weight:700}
.tabs{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;margin-bottom:4px;padding:3px;border-radius:10px;background:var(--ink);border:1px solid var(--line)}
.tabs:before{content:'';position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:7px;background:var(--panel2);transition:transform .32s var(--ease-out)}
.tabs[data-t=day]:before{transform:translateX(100%)}
.tabs button,.tabs button:hover{position:relative;z-index:1;width:auto;min-height:36px;margin:0;padding:0 18px;border:0;background:transparent!important;box-shadow:none!important;color:var(--mut);font-size:14px;transform:none!important}

/* ---------- network ---------- */
let UID='';try{UID=localStorage.getItem('dd_uid')||'';if(!UID){UID=crypto.randomUUID();localStorage.setItem('dd_uid',UID)}}catch(e){UID=String(Math.random()).slice(2)+Date.now()}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let waking=false;
async function api(url,body){ // shows a "waking up" notice if the free server is asleep (first request after a quiet spell)
 const t=url==='/api/answer'?0:setTimeout(()=>{waking=true;net(true,'Waking up the deep… up to 30 seconds')},2500);
 try{return await apiRaw(url,body)}finally{clearTimeout(t);if(waking){waking=false;net(false)}}}
async function apiRaw(url,body){for(let n=0;;n++){let r;
 try{r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})}catch(e){if(n<2){await sleep(800*(n+1));continue}throw Object.assign(new Error('network'),{status:0})}
 if(r.ok)return r.json();const j=await r.json().catch(()=>({}));
 if((r.status>=500||r.status===429)&&n<2){await sleep(1000*(n+1));continue}
 throw Object.assign(new Error(j.error||String(r.status)),{status:r.status})}}
/* the server keeps games in memory, so a restart (Render sleeping or a redeploy) loses dives in progress */
function apiErr(e,retry){const fb=$('fb'),btn=$('go');if(!fb)return;
 if(e.status===400||e.status===409){timerStop();fb.innerHTML='<span class="err pop">This dive was reset because the server restarted.</span>';$('a').disabled=true;btn.textContent='Back to menu';btn.onclick=()=>nav(home);return true}
 fb.innerHTML=`<span class="err pop">${e.status===503?"Couldn't check that answer just now. Try again.":e.status===429?'Too many tries, wait a moment.':"Can't reach the server. Check your connection."}</span>`;return false}
/* rooms: each tab keeps a seat token so a dropped connection (phone locked, wifi blip, page reload) rejoins the same seat */
const seatFor=c=>{try{let v=sessionStorage.getItem('dd_seat_'+c);if(!v){v=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());sessionStorage.setItem('dd_seat_'+c,v)}return v}catch(e){return 'seat'+Math.random()}};
const net=(on,t)=>{const n=$('net');if(!n)return;n.textContent=t||'Reconnecting…';n.classList.toggle('on',!!on)};
addEventListener('offline',()=>net(true,"You're offline"));addEventListener('online',()=>net(false));
const RMAPI={join(name,o){return new Promise((resolve,reject)=>{
 let ws=null,st=null,h=null,opened=false,closed=false,tries=0,timer=null;const seat=seatFor(o.code);
 const emit=()=>{if(!h||!st)return;h({peers:st.players.map(p=>({peer:p.id,kind:'viewer',isMe:p.id===st.you,sameTab:p.id===st.you,presence:{name:p.name,score:p.score,q:p.q,done:p.done,host:p.host,away:p.away,go:st.go}}))})};
 const room={prompts:null,gid:null,me:null,go:0,onGone:null,
  presence(p){if(p&&p.go&&ws&&ws.readyState===1)ws.send(JSON.stringify({t:'start'}))},
  size(n){if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'size',n}))},
  onPeers(f){h=f;emit();return()=>{h=null}},
  leave(){closed=true;clearTimeout(timer);net(false);try{ws.send(JSON.stringify({t:'leave'}))}catch(e){}try{ws.close()}catch(e){}try{sessionStorage.removeItem('dd_room')}catch(e){}},
  wake(){if(!closed&&opened&&(!ws||ws.readyState>1)){clearTimeout(timer);tries=0;connect()}}};
 function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');const me=ws;
  ws.onopen=()=>me.send(JSON.stringify({t:'join',code:o.code,name:o.name,uid:UID,seat,create:!!o.host&&!opened}));
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
   if(m.t==='err'){closed=true;net(false);if(!opened)reject(new Error(m.msg));else if(room.onGone)room.onGone(m.msg);try{me.close()}catch(x){}return}
   if(m.t==='state'){st=m;tries=0;net(false);room.prompts=m.prompts||null;room.gid=m.gid||null;room.go=m.go||0;room.n=m.n||7;room.me=m.players.find(p=>p.id===m.you)||null;
    if(!opened){opened=true;try{sessionStorage.setItem('dd_room',o.code)}catch(x){}resolve(room)}emit()}};
  ws.onclose=()=>{if(closed||me!==ws)return;
   if(!opened&&tries>=2){closed=true;reject(new Error('closed'));return}
   if(opened)net(true);clearTimeout(timer);timer=setTimeout(connect,Math.min(8000,700*2**tries++))}}
 connect()})}};
