const bub=$('bub');for(let n=0;n<22;n++){const b=document.createElement('i'),s=4+Math.random()*14;b.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;--dx:${Math.random()*60-30}px;animation-duration:${6+Math.random()*10}s;animation-delay:-${Math.random()*14}s`;bub.appendChild(b)}
function zone(t){let z=Z[0][1];for(const[a,n]of Z)if(t>=a)z=n;return z}
function tween(from,to,el,suf){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e)+suf;if(k<1)requestAnimationFrame(f)})(t0)}
function hud(){const t=G?G.tot:0,k=Math.min(1,t/MAX),m=(a,b)=>Math.round(a+(b-a)*k);
 document.body.style.background=`linear-gradient(rgb(${m(10,2)},${m(74,6)},${m(122,16)}),rgb(${m(2,0)},${m(13,2)},${m(28,6)}))`;
 $('bar').style.width=k*100+'%';$('rays').style.opacity=1-k;document.documentElement.style.setProperty('--g',(0.7+k*1.4).toFixed(2));
 $('mk2').style.top=k*100+'%';
 if(t>shown)dive(t-shown);
 tween(shown,t,$('depth'),' m');shown=t;const zn=zone(t);
 if($('zone').textContent!==zn){$('zone').textContent=zn;if(t>0)banner(zn)}}
function sparkle(){const r=$('mk2').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 for(let i=0;i<14;i++){const e=document.createElement('i');e.className='sp';const a=Math.random()*6.28,d=30+Math.random()*50;
  e.style.cssText=`left:${cx}px;top:${cy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-20}px;animation-delay:${Math.random()*.25}s`;
  e.addEventListener('animationend',()=>e.remove());document.body.appendChild(e)}}
function dive(d){sparkle();const dv=$('mk2');dv.classList.remove('on');void dv.offsetWidth;dv.classList.add('on');
 const n=Math.min(36,8+Math.round(d/4)),b=$('bub');
 for(let i=0;i<n;i++){const e=document.createElement('i'),s=4+Math.random()*16;e.className='f';
  e.style.cssText=`left:${Math.random()*100}%;width:${s}px;height:${s}px;--dx:${Math.random()*80-40}px;animation:rise ${.8+Math.random()*1.1}s ${Math.random()*.4}s both`;
  e.addEventListener('animationend',()=>e.remove());b.appendChild(e)}}
function banner(n){const z=$('zb');z.textContent=n;z.classList.remove('on');void z.offsetWidth;z.classList.add('on')}
/* ---------- seeded picks ---------- */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(seed){const r=rng(hash(seed)),a=[...POOL.keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,7).map(i=>POOL[i])}
/* ---------- screens ---------- */
function scr(n){document.body.dataset.s=n}
const av=n=>`<span class="av" style="background:hsl(${hash(String(n))%360} 75% 62%)">${esc(String(n).slice(0,1).toUpperCase())}</span>`;
const shk=e=>{e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')};
function name(){const n=$('nk');nick=((n&&n.value.trim())||nick||'Krill'+(100+Math.floor(Math.random()*900))).slice(0,16);try{localStorage.setItem('dd_nick',nick)}catch(e){}return nick}
function leave(){if(room){try{room.leave()}catch(e){}room=null}if(unsubP){unsubP();unsubP=null}roomCode='';curRound=0;peers=[]}
function home(){leave();G=null;shown=0;hud();$('rm').innerHTML='';scr('home');
 $('box').innerHTML=`<div class="home"><div class="hero">${JF}</div><h1 class="logo">DEEPDIVE</h1><p class="tag">Seven prompts. The rarer your answer, the deeper you sink.</p><input id="nk" class="nick" maxlength="16" placeholder="Your nickname" value="${esc(nick)}"><button id="solo">Solo dive</button><button id="mp" class="alt">Multiplayer</button><button id="lbb" class="alt">Leaderboard</button><details class="how"><summary>How to play</summary><p>Answer each prompt with the first real thing that comes to mind. Common answers barely count. Rare but genuine answers sink you deeper. Reach the abyss.</p></details></div>`;
 $('solo').onclick=async()=>{name();try{const r=await api('/api/game',{uid:UID,name:nick});start(r.prompts.map(q=>({q})),r.gameId)}catch(e){$('solo').textContent='Server unavailable, try again'}};
 $('mp').onclick=()=>{name();mpHub()};$('lbb').onclick=()=>{name();lbScreen()}}
function mpHub(){scr('mp');$('rm').innerHTML='';
 $('box').innerHTML=`<div class="q"><h2>Multiplayer</h2><p class="note" style="margin:-8px 0 18px">Race friends through the same seven prompts.</p><button id="mk" style="margin-top:0">Create room</button><div class="or">or join with a code</div><div class="row"><input id="cd" maxlength="4" placeholder="CODE" style="text-transform:uppercase"><button id="jn" class="alt">Join</button></div><div class="note" id="mn">${RM?'':'Rooms need a signed-in claude.ai view.'}</div><button class="alt" id="bk">Back</button></div>`;
 $('mk').onclick=()=>joinRoom(Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join(''),true);
 $('jn').onclick=()=>{const c=$('cd').value.trim().toUpperCase();if(c.length!==4)shk($('cd'));else joinRoom(c,false)};
 $('bk').onclick=home}
async function joinRoom(c,host){
 if(!RM||!RM.join){$('mn').textContent='Rooms are unavailable here.';return}
 $('mn').textContent='Joining…';
 try{room=await RM.join('r'+c,{code:c,host:!!host,name:nick})}catch(e){room=null;$('mn').textContent='Could not join room.';return}
 roomCode=c;curRound=0;peers=[];unsubP=room.onPeers(ch=>{peers=ch.peers;roomTick()});
 room.presence({name:nick,host:!!host,score:0,q:0,done:false,go:0});scr('lobby');drawLobby()}
const viewers=()=>peers.filter(p=>p.kind==='viewer'&&p.presence&&p.presence.name!==undefined);
const me=()=>viewers().find(p=>p.isMe&&p.sameTab);
function isHost(){const v=viewers(),m=me();if(!m)return false;const hs=v.filter(p=>p.presence.host);return hs.length?hs.some(p=>p.peer===m.peer):v.map(p=>p.peer).sort()[0]===m.peer}
function roomTick(){if(!room)return;const s=document.body.dataset.s,g=Math.max(0,...viewers().map(p=>+p.presence.go||0));
 if(g&&g!==curRound&&(s==='lobby'||s==='end')){startRound(g);return}
 if(s==='lobby')drawLobby();else if(s==='game')drawRace();else if(s==='end')drawResults()}
function drawLobby(){const v=viewers(),host=isHost();
 $('box').innerHTML=`<div class="q left"><div style="text-align:center"><small>Room code</small><br><div class="codebox"><span class="code">${esc(roomCode)}</span></div><br><button class="alt sm" id="cp">Copy invite</button></div><h3>PLAYERS (${v.length})</h3><ul class="pl">${v.map(p=>`<li>${av(p.presence.name)}<span class="nm">${esc(String(p.presence.name).slice(0,16))}</span>${p.presence.host?'<span class="tg">HOST</span>':''}${p.isMe&&p.sameTab?'<span class="tg">YOU</span>':''}</li>`).join('')}</ul>
 <div class="note" style="text-align:center">${host?(v.length<2?'Waiting for friends to join…':'Everyone here? Start when ready.'):'Waiting for the host to start…'}</div>${host?'<button id="st">Start dive</button>':''}<button class="alt" id="lv">Leave room</button></div>`;
 $('cp').onclick=()=>{try{navigator.clipboard.writeText('Join my Deepdive room with code '+roomCode);$('cp').textContent='Copied'}catch(e){$('cp').textContent=roomCode}};
 if(host)$('st').onclick=()=>room.presence({go:Date.now(),score:0,q:0,done:false});
 $('lv').onclick=home}
async function startRound(g){curRound=g;room.presence({score:0,q:0,done:false});$('rm').innerHTML='';
 const c=$('count');for(const n of['3','2','1','GO']){c.textContent=n;c.classList.remove('on');void c.offsetWidth;c.classList.add('on');await new Promise(r=>setTimeout(r,n==='GO'?500:800))}
 if(room&&curRound===g){if(room.prompts){start(room.prompts.map(q=>({q})),room.gid);drawRace()}}}
function drawRace(){if(!room)return;const v=viewers().sort((a,b)=>(+b.presence.score||0)-(+a.presence.score||0));
 $('rm').innerHTML=`<div class="race">${v.map(p=>{const x=p.presence,sc=+x.score||0;return `<div class="rr ${p.isMe&&p.sameTab?'me':''}">${av(x.name)}<div class="rb"><i style="width:${Math.min(100,sc/MAX*100)}%"></i></div><b>${sc}</b></div>`}).join('')}</div>`}
function drawResults(){$('rm').innerHTML='';const v=viewers().sort((a,b)=>(+b.presence.score||0)-(+a.presence.score||0)),pend=v.filter(p=>!p.presence.done).length,top=v.slice(0,3),hs=[100,76,56];
 $('box').innerHTML=`<div class="q"><small>${pend?'Others still diving…':'Final results'}</small><h2>${pend?'Race in progress':'Dive complete'}</h2><div class="pod">${[1,0,2].filter(i=>top[i]).map(i=>{const x=top[i].presence;return `<div class="pc"><div class="pn">${esc(String(x.name).slice(0,12))}</div><div class="ps">${+x.score||0} m</div><div class="pb" style="height:${hs[i]}px">${['🥇','🥈','🥉'][i]}</div></div>`}).join('')}</div>
 <ul class="pl">${v.map((p,i)=>`<li class="${p.isMe&&p.sameTab?'me':''}"><span class="tg" style="min-width:18px;text-align:center">${i+1}</span>${av(p.presence.name)}<span class="nm">${esc(String(p.presence.name).slice(0,16))}</span><span class="tg">${+p.presence.score||0} m${p.presence.done?'':' …'}</span></li>`).join('')}</ul><div class="note">${esc(saveMsg)}</div>
 ${isHost()?`<button id="rm2" ${pend?'disabled':''}>Rematch</button>`:'<div class="note">The host can start a rematch.</div>'}<button class="alt" id="lv">Leave room</button></div>`;
 if(isHost())$('rm2').onclick=()=>room.presence({go:Date.now()});
 $('lv').onclick=home}
function start(qs,gid){scr('game');G={qs,gid,i:0,tot:0,log:[]};shown=0;hud();show()}
function show(){const p=G.qs[G.i];$('box').innerHTML=`<div class="q"><small>Prompt ${G.i+1} of 7</small><h2>${esc(p.q)}</h2><input id="a" autocomplete="off" placeholder="Your answer"><button id="go">Dive</button><div class="fb" id="fb"></div></div>`;
 const inp=$('a');inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')go()};$('go').onclick=go}
function shake(){const i=$('a');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake')}
async function go(){if(busy)return;const inp=$('a'),v=inp.value.trim(),p=G.qs[G.i];if(v.length<2){shake();return}
 busy=true;$('go').disabled=true;$('fb').innerHTML='<span class="dots">Checking</span>';
 let r;try{r=await api('/api/answer',{gameId:G.gid,i:G.i,answer:v})}catch(e){busy=false;$('go').disabled=false;$('fb').textContent='Connection problem. Try again.';return}
 busy=false;$('go').disabled=false;
 if(!r.valid){shake();$('fb').textContent="That's not a real answer. Try again.";return}
 const pts=r.pts,lab=r.rarity<20?'Everyone says that':r.rarity<50?'Fairly common':r.rarity<80?'Uncommon':'Deep cut!';
 inp.disabled=true;G.tot+=pts;G.log.push([v,pts,r.rarity]);hud();
 if(room)room.presence({score:G.tot,q:G.i+1});
 $('fb').innerHTML=`<div class="pop ${r.rarity>=80?'rare':''}">${lab} <b>+${pts} m</b><br><small style="color:var(--mut)">${esc(r.note||'')}</small></div>`;
 if(r.rarity>=80){const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
 $('go').textContent=G.i<6?'Next':'See result';$('go').onclick=()=>{G.i++;G.i<7?show():end()}}
async function saveScore(t){try{const r=await api('/api/finish',{gameId:G.gid});return r.message}catch(e){return'Could not post score.'}}
async function end(){const share=`Deepdive: ${G.tot} m (${zone(G.tot)})\n`+G.log.map(l=>l[2]>=80?'🟪':l[2]>=50?'🟦':'⬜').join('');
 if(room){room.presence({score:G.tot,q:7,done:true});saveMsg='Posting score…';saveScore(G.tot).then(m=>{saveMsg=m;if(room&&document.body.dataset.s==='end')drawResults()});scr('end');drawResults();return}
 scr('end');
 $('box').innerHTML=`<div class="q"><small>You reached</small><div class="big" id="bt">0 m</div><h2>${zone(G.tot)}</h2><ul>${G.log.map((l,n)=>`<li style="animation-delay:${n*.12}s"><span>${esc(G.qs[n].q.replace('Name ',''))}: ${esc(l[0])}</span><span>${l[1]} m</span></li>`).join('')}</ul><div class="note" id="sv">Posting score…</div><button id="sh">Copy result</button><button id="re" class="alt">Back to menu</button></div>`;
 tween(0,G.tot,$('bt'),' m');
 $('sh').onclick=()=>{try{navigator.clipboard.writeText(share);$('sh').textContent='Copied'}catch(e){$('sh').textContent='Copy failed'}};
 $('re').onclick=home;
 const m=await saveScore(G.tot);const sv=$('sv');if(sv)sv.textContent=m}
/* ---------- leaderboard ---------- */
async function lbScreen(){scr('lb');$('rm').innerHTML='';let d={all:[],day:[]};
 try{d=await(await fetch('/api/leaderboard')).json()}catch(e){}
 const rows=d[tab]||[];
 $('box').innerHTML=`<div class="q"><h2>Leaderboard</h2><div class="tabs"><button id="t1" class="${tab==='all'?'on':''}">All-time</button><button id="t2" class="${tab==='day'?'on':''}">Today</button></div><ul class="pl">${rows.map((r,i)=>`<li class="${r.id===UID.slice(0,6)?'me':''}"><span class="tg" style="min-width:18px;text-align:center">${i+1}</span>${av(r.name)}<span class="nm">${esc(String(r.name).slice(0,16))}</span><span class="tg">${r.v} m</span></li>`).join('')||'<li><span>No scores yet. Be the first!</span></li>'}</ul><button class="alt" id="bk">Back</button></div>`;
 $('t1').onclick=()=>{tab='all';lbScreen()};$('t2').onclick=()=>{tab='day';lbScreen()};$('bk').onclick=home}
/* ---------- init ---------- */
const JF=`<svg class="jf" viewBox="0 0 40 56"><path class="b" d="M5 26C5 6 35 6 35 26Q30 22 25 26Q20 22 15 26Q10 22 5 26Z" fill="#2fe8c026" stroke="#7dffe6" stroke-width="1.4"/><path class="b" d="M12 24C12 12 28 12 28 24M20 9V24" fill="none" stroke="#7dffe680" stroke-width=".8"/><circle class="s" cx="11" cy="21" r="1.5" style="animation-delay:-0.0s"/><circle class="s" cx="16" cy="16" r="1.5" style="animation-delay:-0.4s"/><circle class="s" cx="20" cy="12" r="1.5" style="animation-delay:-0.8s"/><circle class="s" cx="24" cy="16" r="1.5" style="animation-delay:-1.2000000000000002s"/><circle class="s" cx="29" cy="21" r="1.5" style="animation-delay:-1.6s"/><g class="t" style="animation-delay:0s"><path d="M12 26Q9 36 13 44T11 54" fill="none" stroke="#7dffe644" stroke-width="1.3" stroke-linecap="round"/><path class="l" pathLength="100" style="animation-delay:0.0s" d="M12 26Q9 36 13 44T11 54" fill="none" stroke="#7dffe6" stroke-width="2" stroke-linecap="round"/></g><g class="t" style="animation-delay:-0.7s"><path d="M18 26Q15 38 19 46T17 55" fill="none" stroke="#9d8bff44" stroke-width="1.3" stroke-linecap="round"/><path class="l" pathLength="100" style="animation-delay:-1.0499999999999998s" d="M18 26Q15 38 19 46T17 55" fill="none" stroke="#9d8bff" stroke-width="2" stroke-linecap="round"/></g><g class="t" style="animation-delay:-1.3s"><path d="M24 26Q27 36 23 45T26 55" fill="none" stroke="#7dffe644" stroke-width="1.3" stroke-linecap="round"/><path class="l" pathLength="100" style="animation-delay:-1.9500000000000002s" d="M24 26Q27 36 23 45T26 55" fill="none" stroke="#7dffe6" stroke-width="2" stroke-linecap="round"/></g><g class="t" style="animation-delay:-1.9s"><path d="M29 26Q31 35 28 43T30 53" fill="none" stroke="#9d8bff44" stroke-width="1.3" stroke-linecap="round"/><path class="l" pathLength="100" style="animation-delay:-2.8499999999999996s" d="M29 26Q31 35 28 43T30 53" fill="none" stroke="#9d8bff" stroke-width="2" stroke-linecap="round"/></g></svg>`;
$('mk2').innerHTML=JF;document.querySelector('.krill').innerHTML=JF;
/* ---------- network ---------- */
let UID='';try{UID=localStorage.getItem('dd_uid')||'';if(!UID){UID=crypto.randomUUID();localStorage.setItem('dd_uid',UID)}}catch(e){UID=String(Math.random()).slice(2)+Date.now()}
async function api(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);return r.json()}
const RMAPI={join(name,o){return new Promise((resolve,reject)=>{
 const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');let st=null,h=null,opened=false;
 const emit=()=>{if(!h||!st)return;h({peers:st.players.map(p=>({peer:p.id,kind:'viewer',isMe:p.id===st.you,sameTab:p.id===st.you,presence:{name:p.name,score:p.score,q:p.q,done:p.done,host:p.host,go:st.go}}))})};
 const room={prompts:null,gid:null,presence(p){if(p&&p.go&&ws.readyState===1)ws.send(JSON.stringify({t:'start'}))},onPeers(f){h=f;emit();return()=>{h=null}},leave(){try{ws.send(JSON.stringify({t:'leave'}))}catch(e){}ws.close()}};
 ws.onopen=()=>ws.send(JSON.stringify({t:'join',code:o.code,name:o.name,uid:UID,create:o.host}));
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
  if(m.t==='err'){if(!opened)reject(new Error(m.msg));return}
  if(m.t==='state'){st=m;room.prompts=m.prompts||null;room.gid=m.gid||null;if(!opened){opened=true;resolve(room)}emit()}};
 ws.onerror=()=>{if(!opened)reject(new Error('ws'))};ws.onclose=()=>{if(!opened)reject(new Error('closed'))}})}};
RM=RMAPI;DB=true;
home();
</script></body></html>
